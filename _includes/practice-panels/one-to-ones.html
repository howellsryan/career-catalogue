<section class="px-panel" id="panel-one-to-ones" aria-labelledby="practice-tool-title">
    <div class="px-layout">
      <aside class="px-side">
        <div class="px-field">
          <p class="px-legend" id="one-label">What you are actually there for</p>
          <div class="px-chips" role="group" aria-labelledby="one-label" id="one-chips">
            <button type="button" class="px-chip" data-one="any" aria-pressed="true">Any</button>
            <button type="button" class="px-chip" data-one="ease" aria-pressed="false">Ease in</button>
            <button type="button" class="px-chip" data-one="work" aria-pressed="false">The work</button>
            <button type="button" class="px-chip" data-one="growth" aria-pressed="false">Growth</button>
            <button type="button" class="px-chip" data-one="feedback" aria-pressed="false">Feedback</button>
            <button type="button" class="px-chip" data-one="energy" aria-pressed="false">Energy</button>
            <button type="button" class="px-chip" data-one="new" aria-pressed="false">New to the team</button>
          </div>
        </div>
        <p class="px-hint">Ask one. Then stop talking. The follow-up is there for when the first answer was polite rather than true.</p>
      </aside>
      <div class="px-stage">
        <article class="px-card" id="one-card" aria-live="polite">
          <p class="px-kicker" id="one-kicker"></p>
          <h2 class="px-question" id="one-question"></h2>
          <p class="px-facilitate" id="one-why"></p>
          <p class="px-follow" id="one-follow"></p>
        </article>
        <div class="px-actions">
          <button type="button" class="px-btn px-btn--primary" id="one-draw">Another question</button>
          <button type="button" class="px-btn" id="one-copy">Copy</button>
        </div>
      </div>
    </div>
  </section>
